# CI: lint + benchopt design tests + a native end-to-end ingestion/scoring
# run on the Real dataset, plus a Docker image build.
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: |
          pip install -U pip flake8 pytest
          # CPU torch first, so requirements.txt keeps it (no CUDA wheels).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: flake8 . --max-line-length=79 --exclude=.git,worktrees,__cache__
      - name: benchopt design tests
        run: benchopt test benchmark --skip-install
      - name: Smoke run on Simulated
        run: |
          benchopt run benchmark --config local_config.yml -d Simulated \
            --no-cache --no-plot --no-html --no-display
      - name: Download firegrid.parquet (release data-v1)
        # data/ is not in git: fetch the published table, check its hash.
        run: |
          mkdir -p data/processed
          curl -fsSL --retry 5 -o data/processed/firegrid.parquet \
            https://github.com/${{ github.repository }}/releases/download/data-v1/firegrid.parquet
          echo "b6f8b259487096d8ac407970b8a45fefcbe30bceaf893f191175c9f5596a9abc  data/processed/firegrid.parquet" \
            | sha256sum -c -
      - name: Build bundle + end-to-end ingestion + scoring (Real)
        run: |
          benchopt prepare benchmark --config local_config.yml
          python tools/create_bundle.py
          python -c "import zipfile; zipfile.ZipFile('bundle.zip').extractall('_codabench/bundle')"
          python _codabench/bundle/ingestion_program/ingestion.py \
            --submission-dir _codabench/bundle/solution \
            --input-data _codabench/bundle/main_phase/input_data \
            --output-dir _codabench/ingestion
          python _codabench/bundle/scoring_program/scoring.py \
            --prediction-dir _codabench/ingestion \
            --reference-dir _codabench/bundle/main_phase/reference_data \
            --output-dir _codabench/scoring
          python -c "import json, yaml; s=json.load(open('_codabench/scoring/scores.json')); \
            keys={c['key'] for b in yaml.safe_load(open('competition.yaml', encoding='latin-1'))['leaderboards'] for c in b['columns']}; \
            assert keys <= set(s), (keys, s); print('scores OK:', s)"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the CPU base image and the competition image on top
        run: |
          docker build -f tools/Dockerfile.base -t codabench-benchopt-test .
          docker build -f tools/Dockerfile -t codabench-compet-test \
            --build-arg BASE=codabench-benchopt-test .
