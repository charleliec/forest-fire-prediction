version: 2
title: "Where will fires start today? Daily wildfire risk in France"
description: >
  Every day, rank the 25 km cells of metropolitan France by their risk of a
  wildfire starting that day, so that firefighting resources can be
  pre-positioned. Data: the French forest-fire database BDIFF (2015-2025),
  Météo-France SIM2 daily weather and MODIS MOD13Q1 NDVI. Score: the share of
  fires that start in each day's 50 highest-risk cells. Submissions are code
  (a benchopt solver) that trains on the platform. The public leaderboard
  scores the year 2018; the final ranking uses the hidden year 2025.
image: logo.png
registration_auto_approve: False

# The image submissions run in: the base image, or your own built from
# tools/Dockerfile when requirements.txt adds packages. The benchmark and the
# prepared data ship in the phase input_data.
docker_image: ghcr.io/x-datascience-datacamp/codabench-benchopt:latest

# Only the leaderboard metrics are exposed.
enable_detailed_results: False
show_detailed_results_in_submission_panel: False
show_detailed_results_in_leaderboard: False

terms: pages/terms.md
pages:
  - title: Participation
    file: pages/participate.md
  - title: Timeline
    file: pages/timeline.md

tasks:
  - index: 0
    name: Daily wildfire risk
    description: >
      The ingestion program runs the benchopt benchmark on your submission
      (training on the platform); scoring parses the results.
    input_data: main_phase/input_data/
    reference_data: main_phase/reference_data/
    ingestion_program: ingestion_program/
    scoring_program: scoring_program/

solutions:
  - index: 0
    tasks:
      - 0
    path: solution/

# Dates are UTC+0, in the documented YYYY-MM-DD HH:MM:SS format.
phases:
  - index: 0
    name: Competition
    description: >
      Build, train and submit your model. The public column scores the public
      test set; the final ranking uses the hidden private test set.
    start: 2026-11-02 00:00:00
    end: 2027-03-31 23:59:59
    execution_time_limit: 3600
    max_submissions_per_day: 5
    # Keep the test predictions and the hidden private metric private.
    hide_prediction_output: True
    hide_score_output: True
    tasks:
      - 0

# Column keys are those of scores.json (scoring program), averaged over the
# CV folds: the objective's metrics (<metric>_cv, <metric>_public),
# <metric>_<test set> for each hidden test set of the reference data, and
# train_time (mean per fold) and duration.
leaderboards:
  - title: Results
    key: main
    columns:
      - title: Fires captured, top 50 (2018)
        key: capture_public
        index: 0
        sorting: desc
      - title: Fires captured, top 50 (2025)
        key: capture_private
        index: 1
        sorting: desc
        hidden: True
      - title: Average precision (2018)
        key: ap_public
        index: 2
        sorting: desc
      - title: Average precision (2025)
        key: ap_private
        index: 3
        sorting: desc
        hidden: True
      - title: Fires captured, top 50 (CV)
        key: capture_cv
        index: 4
        sorting: desc
      - title: Average precision (CV)
        key: ap_cv
        index: 5
        sorting: desc
      - title: Train time (s)
        key: train_time
        index: 6
        sorting: asc
      - title: Duration (s)
        key: duration
        index: 7
        sorting: asc
